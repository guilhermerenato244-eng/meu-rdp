name: Meu RDP

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Versão do Windows'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
      username:
        description: 'Usuário do RDP'
        required: false
        default: 'meurdp'
      hours:
        description: 'Horas ligada (máx. 5.5)'
        required: false
        default: '5'

jobs:
  rdp:
    runs-on: ${{ github.event.inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      # Rede privada: o celular acessa pelo IP do Tailscale (100.x.x.x)
      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: rdp-github

      # ---------- Recuperar dados da sessão anterior ----------
      - name: Buscar backup anterior
        uses: actions/cache/restore@v4
        with:
          path: C:\backup\dados.7z
          key: rdp-dados-restore-${{ github.run_id }}
          restore-keys: |
            rdp-dados-

      - name: Preparar pasta Dados
        shell: pwsh
        env:
          ARCHIVE_PASS: ${{ secrets.ARCHIVE_PASS }}
        run: |
          New-Item -ItemType Directory -Force C:\Dados | Out-Null
          if (Test-Path C:\backup\dados.7z) {
            7z x -y "-p$env:ARCHIVE_PASS" -oC:\Dados C:\backup\dados.7z | Out-Null
            Write-Host "Dados restaurados."
          } else {
            Write-Host "Nenhum backup anterior (primeira vez)."
          }
          # Atalho na área de trabalho de todos os usuários
          $w = New-Object -ComObject WScript.Shell
          $s = $w.CreateShortcut("C:\Users\Public\Desktop\Dados.lnk")
          $s.TargetPath = "C:\Dados"
          $s.Save()

      # ---------- RDP ----------
      - name: Ativar RDP e criar usuário
        shell: pwsh
        env:
          RDP_USER: ${{ github.event.inputs.username }}
        run: |
          $chars = (48..57) + (65..90) + (97..122)
          $pass = (-join ($chars | Get-Random -Count 20 | ForEach-Object { [char]$_ })) + "aA1!"
          Write-Host "::add-mask::$pass"
          "RDP_PASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $sec -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 1
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service -Name TermService -StartupType Automatic
          Restart-Service -Name TermService -Force

      - name: Enviar login e senha no Telegram
        shell: pwsh
        env:
          RDP_USER: ${{ github.event.inputs.username }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          $ts = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) { $ts = "tailscale" }
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()

          $text = "RDP pronto`nIP: $ip`nUsuário: $env:RDP_USER`nSenha: $env:RDP_PASS`n`nLigue o Tailscale no celular antes de conectar.`nSalve seus arquivos na pasta Dados (atalho na área de trabalho): só ela é guardada."
          $body = @{ chat_id = $env:TG_CHAT_ID; text = $text }
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/sendMessage" -Method Post -Body $body | Out-Null

      # ---------- Programas (lista no arquivo programas.txt) ----------
      - name: Instalar programas
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path programas.txt) {
            Get-Content programas.txt | ForEach-Object {
              $p = $_.Trim()
              if ($p -and -not $p.StartsWith('#')) { choco install $p -y --no-progress }
            }
          }

      - name: Manter ligada
        shell: pwsh
        env:
          HOURS: ${{ github.event.inputs.hours }}
        run: |
          $h = [math]::Min([double]$env:HOURS, 5.5)
          $end = (Get-Date).AddHours($h)
          while ((Get-Date) -lt $end) { Start-Sleep -Seconds 60 }

      # ---------- Guardar dados (roda mesmo se você cancelar) ----------
      - name: Empacotar dados (criptografado)
        if: always()
        shell: pwsh
        env:
          ARCHIVE_PASS: ${{ secrets.ARCHIVE_PASS }}
        run: |
          $n = (Get-ChildItem C:\Dados -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($n -gt 0) {
            New-Item -ItemType Directory -Force C:\backup | Out-Null
            Remove-Item C:\backup\dados.7z -ErrorAction SilentlyContinue
            7z a -t7z "-p$env:ARCHIVE_PASS" -mhe=on -ssw C:\backup\dados.7z C:\Dados\*
          } else {
            Write-Host "Pasta Dados vazia, nada a guardar."
          }

      - name: Guardar backup
        if: always() && hashFiles('C:/backup/dados.7z') != ''
        uses: actions/cache/save@v4
        with:
          path: C:\backup\dados.7z
          key: rdp-dados-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Avisar no Telegram
        if: always()
        shell: pwsh
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          $body = @{ chat_id = $env:TG_CHAT_ID; text = "Sessão encerrada. Dados da pasta Dados guardados." }
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_BOT_TOKEN)/sendMessage" -Method Post -Body $body | Out-Null
          
